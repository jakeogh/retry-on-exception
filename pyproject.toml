[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retry-on-exception"
version = "1!0.0.1787109862"
description = "Decorator to retry a function on exception"
authors = [
    { name = "Justin Keogh", email = "github.com@v6y.net" },
]
dependencies = [
    "delay-timer @ git+https://github.com/jakeogh/delay-timer@111013f9ae8290c56fecdcf20a8e659f3cd3eaed",
]
license = "ISC"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/jakeogh/retry-on-exception"

[project.scripts]
retry-on-exception-test = "retry_on_exception.retry_on_exception_test:cli"

[tool.setuptools]
include-package-data = true
zip-safe = false

